name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_search:
        description: "Also run the bounded solver campaigns"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned solver
        run: python -m pip install -r requirements.txt
      - name: Run independent simulation and boundary controls
        run: |
          mkdir -p run-results
          python verify.py
          cp verification.json run-results/verification.json
      - name: Install Lean 4.35.0 with release checksum
        shell: bash
        run: |
          curl --retry 3 --max-time 300 -fsSL \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            -o "$RUNNER_TEMP/lean.tar.zst"
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd --no-same-owner -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Build the pinned Lake project
        run: lake build
      - name: Replay partial proofs and reject a full-solution claim
        run: python check_formal.py --kit .lake/packages/rule30prize --output-dir run-results
      - name: Run bounded solver campaigns
        if: github.event_name == 'workflow_dispatch' && inputs.run_search
        run: |
          python search.py --output run-results/sat-results.json
          python search.py --radii 33,40,48,56,64,96 --timeout-ms 12000 --output run-results/sat-large.json
          python left_search.py
          cp left-results.json run-results/left-results.json
      - name: Upload this run's verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rule30-verification-${{ github.sha }}
          path: run-results/
          if-no-files-found: warn
          retention-days: 30

